# A sealed-bid auction on Vela (Horizen) as a recipe: the entry is the auction console (web.syn), a
# web app that embeds app/app.syn into the release's guest module, deploys it to Vela and runs the
# auction from the browser: the seller's desk and a desk per bidder it sets up on a devnet. This file
# only says what the code cannot say about itself; the `require` blocks are the manifests of
# capabilities. The command-line client in client/ does the same from a terminal, one party per .env.

name = "Sealed-bid auction on Vela"
slug = "vela-auction"
version = "0.2.2"
kind = "web"
entry = "web.syn"
engine = "0.6"
tagline = "A sealed-bid auction on Horizen's Vela, in Synsema: encrypted bids, matching inside the enclave, settlement from escrow; losing bids are never revealed."
tagline_es = "Subasta de sobre cerrado en Vela (Horizen) con Synsema: pujas cifradas, matching dentro del enclave, liquidación desde el escrow; las pujas perdedoras nunca se revelan."
tagline_pt = "Leilão de lance selado no Vela (Horizen) com Synsema: lances cifrados, casamento dentro do enclave, liquidação do escrow; lances perdedores nunca são revelados."

[secrets]
VELA_SECP_KEY = "the seller's secp256k1 key: signs the transactions and pays the fees (hex). On the public devnet the provision hands out Anvil #0, the deployer, whose wallet also funds the demo bidders."
VELA_P521_KEY = "P-521 private key for the encrypted channel with the Executor (hex). Provisioned on the devnet; made by the app itself when empty."

# The public Vela devnet by default: the provision URL hands out a token of your own and fills these
# (and the keys) when the project is created. Point them at your own Vela stack to leave the devnet.
[env]
VELA_RPC_URL = "https://devnet.synsema.app/<token>/rpc"
VELA_AUTHORITY_URL = "https://devnet.synsema.app/<token>/authority"
VELA_SUBGRAPH_URL = "https://devnet.synsema.app/<token>/subgraph/subgraphs/name/hcce"
VELA_PROCESSOR = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
VELA_TEE_AUTHENTICATOR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
VELA_TOKEN = ""
VELA_MAX_FEE = "100"

[provision]
env_url = "https://devnet.synsema.app/token"

# the app's state: the app id, the keys it made, the bidders' desks, the auctions it opened
[volumes]
data = "./data"
